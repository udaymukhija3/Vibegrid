# Render Blueprint — free, effectively-always-on VibeGrid deploy.
#
# Pairs with a free Neon Postgres. See docs/deployment.md ("Free tier") for the
# full click-path. Notes:
#   * plan: free spins down after ~15 min idle; a free uptime ping to /healthz
#     keeps it warm (see the runbook).
#   * The free plan has no pre-deploy hook, so migrations run on boot via
#     VIBEGRID_MIGRATE_ON_BOOT=true (safe here: one instance, nothing to race).
#   * VIBEGRID_ADDR is intentionally unset so the app binds Render's $PORT.
#   * sync: false vars are secrets — set them in the Render dashboard, never here.
services:
  - type: web
    name: vibegrid
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    # CI-gated deployments: create a Deploy Hook (Render dashboard -> Settings)
    # and save it as RENDER_DEPLOY_HOOK_URL. With autoDeploy false, no production
    # deployment occurs when that secret is absent.
    autoDeploy: false
    envVars:
      - key: VIBEGRID_ENV
        value: production
      - key: VIBEGRID_TIMEZONE
        value: UTC
      - key: VIBEGRID_SECURE_COOKIES
        value: "true"
      - key: VIBEGRID_MIGRATE_ON_BOOT
        value: "true"
      - key: VIBEGRID_REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: VIBEGRID_ADMIN_PASSWORD
        sync: false
      - key: VIBEGRID_ADMIN_SESSION_SECRET
        sync: false
      # Not a secret — it is the site's own public origin.
      - key: VIBEGRID_PUBLIC_BASE_URL
        value: https://vibegrid.onrender.com
      # Render generates a random value on sync; read it in the dashboard when
      # pointing a metrics scraper at /metrics.
      - key: VIBEGRID_METRICS_TOKEN
        generateValue: true
      - key: VIBEGRID_TURNSTILE_SITE_KEY
        sync: false
      - key: VIBEGRID_TURNSTILE_SECRET_KEY
        sync: false
      - key: VIBEGRID_OPERATOR_WEBHOOK_URL
        sync: false
      - key: VIBEGRID_TRUSTED_PROXY_CIDRS
        sync: false
