groups:
  - name: vibegrid
    rules:
      - alert: VibeGridMetricsDown
        expr: up{job="vibegrid"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: VibeGrid metrics scrape is down
          description: Prometheus cannot scrape /metrics for more than 2 minutes.

      - alert: VibeGridHighErrorRate
        expr: sum(rate(vibegrid_http_requests_total{job="vibegrid",status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: VibeGrid 5xx rate is elevated
          description: The app is returning more than 0.05 server errors per second for 5 minutes.

      - alert: VibeGridSlowRequests
        expr: histogram_quantile(0.95, sum(rate(vibegrid_http_request_duration_seconds_bucket{job="vibegrid"}[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: VibeGrid p95 latency is above 1s
          description: The 95th percentile request latency has stayed above 1 second for 10 minutes.

      - alert: VibeGridRuntimeMemoryHigh
        expr: vibegrid_process_sys_bytes{job="vibegrid"} > 209715200
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: VibeGrid runtime memory is high
          description: The Go runtime has held more than 200 MiB from the OS for 10 minutes. Check heap, goroutines, cache size, and deploy memory limit.

      - alert: VibeGridDatabasePoolWaiting
        expr: increase(vibegrid_db_wait_count_total{job="vibegrid"}[5m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: VibeGrid database pool is saturated
          description: Requests waited for Postgres connections in the last 5 minutes. Check DB latency, pool sizing, and instance count.

      - alert: VibeGridStorageErrors
        expr: sum(rate(vibegrid_store_operations_total{job="vibegrid",status="error"}[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: VibeGrid storage errors are elevated
          description: Storage interface operations are returning errors at more than 0.05 per second for 5 minutes.

      - alert: VibeGridNotificationBacklogOld
        expr: vibegrid_notification_outbox_oldest_pending_seconds{job="vibegrid"} > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: VibeGrid notifications are delayed
          description: The oldest undelivered notification has been waiting for more than 10 minutes. Check webhook configuration and provider health.

      - alert: VibeGridNotificationDead
        expr: vibegrid_notification_outbox_dead{job="vibegrid"} > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: VibeGrid notification delivery exhausted retries
          description: At least one transactional outbox event is dead and needs operator review or replay.

      - alert: VibeGridNoTraffic
        expr: sum(rate(vibegrid_http_requests_total{job="vibegrid"}[30m])) == 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: VibeGrid has no observed traffic
          description: No requests were recorded for 30 minutes. Check DNS, uptime monitor, and public routing.
