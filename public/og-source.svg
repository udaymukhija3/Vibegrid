<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">VibeGrid</title>
  <description id="description">Make the vibe. Let the crew decide.</description>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f7f2e8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .display { font-family: "Bricolage Grotesque", "Arial Black", Arial, sans-serif; font-weight: 800; }
      .mono { font-family: "IBM Plex Mono", Menlo, monospace; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#0d1220"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="70" y="72" class="display" font-size="38" fill="#f7f2e8">VibeGrid</text>
  <text x="70" y="108" class="mono" font-size="13" fill="#a3e635">PRIVATE CREW RITUAL · BOARD 047</text>

  <text x="68" y="216" class="display" font-size="70" letter-spacing="-4" fill="#f7f2e8">MAKE THE VIBE.</text>
  <text x="68" y="286" class="display" font-size="70" letter-spacing="-4" fill="#f7f2e8">LET THE CREW</text>
  <text x="68" y="356" class="display" font-size="70" letter-spacing="-4" fill="#f7f2e8">DECIDE.</text>

  <line x1="70" y1="410" x2="618" y2="410" stroke="#353b54" stroke-width="2"/>
  <text x="70" y="450" class="mono" font-size="14" fill="#f7f2e8" fill-opacity="0.64">12 FRAGMENTS → PICK 4 → NAME IT → BLIND VOTE</text>
  <text x="70" y="512" class="display" font-size="25" fill="#f7f2e8">No answer key. The people are the game.</text>
  <rect x="70" y="548" width="172" height="12" rx="6" fill="#a3e635"/>
  <rect x="252" y="548" width="56" height="12" rx="6" fill="#f8b43a"/>
  <rect x="318" y="548" width="56" height="12" rx="6" fill="#ef5350"/>
  <rect x="384" y="548" width="104" height="12" rx="6" fill="#7546b8"/>

  <rect x="702" y="102" width="425" height="442" rx="34" fill="#7546b8"/>
  <g transform="rotate(1 900 320)">
    <rect x="680" y="82" width="425" height="442" rx="34" fill="#f7f2e8" stroke="#070a12" stroke-width="5"/>
    <text x="720" y="130" class="mono" font-size="12" fill="#7546b8">TODAY'S CONSTRAINT</text>
    <text x="720" y="171" class="display" font-size="28" fill="#0d1220">Build a week that is</text>
    <text x="720" y="203" class="display" font-size="28" fill="#0d1220">technically under</text>
    <text x="720" y="235" class="display" font-size="28" fill="#0d1220">control.</text>

    <g class="display" font-size="16" text-anchor="middle" fill="#0d1220">
      <rect x="720" y="260" width="162" height="76" rx="15" fill="#a3e635" stroke="#0d1220" stroke-width="3"/>
      <text x="801" y="305">meal prep</text>
      <rect x="896" y="260" width="162" height="76" rx="15" fill="#7546b8" stroke="#0d1220" stroke-width="3"/>
      <text x="977" y="305" fill="#f7f2e8">monday dread</text>
      <rect x="720" y="348" width="162" height="76" rx="15" fill="#ffffff" stroke="#0d1220" stroke-width="3"/>
      <text x="801" y="393">five tabs</text>
      <rect x="896" y="348" width="162" height="76" rx="15" fill="#f8b43a" stroke="#0d1220" stroke-width="3"/>
      <text x="977" y="393">11pm panic</text>
    </g>
    <line x1="720" y1="452" x2="1058" y2="452" stroke="#0d1220" stroke-opacity="0.2" stroke-width="2"/>
    <text x="720" y="485" class="mono" font-size="13" fill="#0d1220">YOUR CARD: CALENDAR COSPLAY</text>
  </g>
</svg>
