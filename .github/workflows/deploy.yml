name: deploy

# Production deploys are gated on CI: render.yaml sets autoDeploy: false, and
# this workflow triggers Render's deploy hook only after the CI workflow
# succeeds on main. A red main therefore never reaches production.
#
# Required repo secret:
#   RENDER_DEPLOY_HOOK_URL - Render dashboard -> vibegrid service -> Settings
#                            -> Deploy Hook. Treat it like a password: anyone
#                            holding the URL can trigger deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  render:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Create a deploy hook in the Render dashboard and add it as a repo secret, or deploys will not run (autoDeploy is off in render.yaml)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Render deploy triggered for ${{ github.event.workflow_run.head_sha }}"
