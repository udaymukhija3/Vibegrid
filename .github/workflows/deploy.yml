name: deploy

# Optional CI-gated deploys: when the RENDER_DEPLOY_HOOK_URL repo secret is set
# AND render.yaml sets autoDeploy: false, this workflow becomes the only deploy
# path and a red main never reaches production. If the hook is absent it skips;
# with the checked-in `autoDeploy: false`, that means no production deployment.
#
#   RENDER_DEPLOY_HOOK_URL - Render dashboard -> vibegrid service -> Settings
#                            -> Deploy Hook. Treat it like a password: anyone
#                            holding the URL can trigger deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  render:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping. render.yaml disables autoDeploy, so this commit will not deploy until the hook is configured or autoDeploy is deliberately re-enabled."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Render deploy triggered for ${{ github.event.workflow_run.head_sha }}"
