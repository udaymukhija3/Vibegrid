name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibegrid
          POSTGRES_PASSWORD: vibegrid
          POSTGRES_DB: vibegrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so a
          # security bump there (e.g. GO-2026-5856) applies to CI automatically.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The schema-upgrade and rollback tests roll migrations backwards, so they
      # need a database of their own: sharing one with TEST_DATABASE_URL would
      # tear the schema out from under every other Postgres test.
      - name: Create migration test database
        run: PGPASSWORD=vibegrid psql -h localhost -U vibegrid -d vibegrid_test -c 'create database vibegrid_migration_test;'

      - name: Test (race detector + Postgres)
        env:
          TEST_DATABASE_URL: postgres://vibegrid:vibegrid@localhost:5432/vibegrid_test?sslmode=disable
          TEST_MIGRATION_DATABASE_URL: postgres://vibegrid:vibegrid@localhost:5432/vibegrid_migration_test?sslmode=disable
        run: go test -race ./...

  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Durable product E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibegrid
          POSTGRES_PASSWORD: vibegrid
          POSTGRES_DB: vibegrid_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build, boot, and mutate the durable product
        env:
          DATABASE_URL: postgres://vibegrid:vibegrid@localhost:5432/vibegrid_e2e?sslmode=disable
          VIBEGRID_MIGRATE_ON_BOOT: "true"
        run: npm run test:e2e
